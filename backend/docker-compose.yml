version: '3.8'

services:
  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: ai-health-navigator-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - health-nav-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI Health Navigator API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ai-health-navigator-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://health_nav_user:health_nav_pass@postgres:5432/health_navigator
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - health-nav-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development API
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ai-health-navigator-api-dev
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://health_nav_user:health_nav_pass@postgres:5432/health_navigator_dev
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=dev-secret-key
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - health-nav-network
    profiles:
      - development
    command: ["python", "-m", "ai_health_navigator.cli", "serve", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai-health-navigator-postgres
    environment:
      - POSTGRES_DB=health_navigator
      - POSTGRES_USER=health_nav_user
      - POSTGRES_PASSWORD=health_nav_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - health-nav-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_nav_user -d health_navigator"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-health-navigator-redis
    command: redis-server --appendonly yes --requirepass redis_pass
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - health-nav-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vector Database (ChromaDB)
  chromadb:
    image: chromadb/chroma:latest
    container_name: ai-health-navigator-chromadb
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8002:8000"
    networks:
      - health-nav-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-health-navigator-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - health-nav-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ai-health-navigator-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - health-nav-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Log Aggregation
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: ai-health-navigator-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - health-nav-network
    restart: unless-stopped
    profiles:
      - monitoring

  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: ai-health-navigator-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - health-nav-network
    restart: unless-stopped
    depends_on:
      - elasticsearch
    profiles:
      - monitoring

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai-health-navigator-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - health-nav-network
    restart: unless-stopped
    profiles:
      - production

  # Background Worker (Celery)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ai-health-navigator-worker
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://health_nav_user:health_nav_pass@postgres:5432/health_navigator
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - health-nav-network
    restart: unless-stopped
    command: ["celery", "-A", "ai_health_navigator.worker", "worker", "--loglevel=info"]
    profiles:
      - production

  # Celery Beat Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ai-health-navigator-scheduler
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://health_nav_user:health_nav_pass@postgres:5432/health_navigator
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - health-nav-network
    restart: unless-stopped
    command: ["celery", "-A", "ai_health_navigator.worker", "beat", "--loglevel=info"]
    profiles:
      - production

  # Model Training Service
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: ml-gpu
    container_name: ai-health-navigator-trainer
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://health_nav_user:health_nav_pass@postgres:5432/health_navigator
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - health-nav-network
    restart: unless-stopped
    command: ["python", "-m", "ai_health_navigator.training.trainer"]
    profiles:
      - ml-training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  health-nav-network:
    driver: bridge
